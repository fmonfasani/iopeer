version: "3.9"
services:
  api:
    build: ./apps/api
    ports:
      - "4000:4000"
    env_file: .env
    depends_on:
      - db

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    env_file: .env

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iopeer
    ports:
      - "5432:5432"
