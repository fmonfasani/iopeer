services:
  postgres:
    image: postgres:16
    container_name: pg-iopeer
    env_file: .env.db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-iopeer}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # (Opcional) pgAdmin web UI
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: pgadmin-iopeer
